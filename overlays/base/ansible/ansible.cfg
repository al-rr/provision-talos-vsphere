[defaults]
remote_user             = vagrant
ansible_user            = vagrant
private_key_file        = /home/vagrant/.ssh/id_ed25519
inventory               = ./haproxy/inventory
host_key_checking       = False
timeout                 = 30
retry_files_enabled     = False
forks                   = 10
stdout_callback         = yaml
bin_ansible_callbacks   = True
deprecation_warnings    = False
verbosity = 0
roles_path = ./roles:~/.ansible/roles:/etc/ansible/roles
collections_paths = /home/vagrant/.ansible/collections:/etc/ansible/collections

[ssh_connection]
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes
control_path = /tmp/ansible-%%r@%%h:%%p
pipelining = True
