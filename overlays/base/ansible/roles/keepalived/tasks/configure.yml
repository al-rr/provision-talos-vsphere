---
- name: Create Keepalived Configuration File
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_conf_path }}"
    owner: "{{ keepalived_conf_owner }}"
    group: "{{ keepalived_conf_group }}"
    mode: "{{ keepalived_conf_mode }}"
  notify:
    - Validate Keepalived Configuration File
    - Reload Keepalived

- name: Configure UFW to allow VRRP multicast/proto (optional)
  when: keepalived_manage_ufw | bool
  block:
    - name: Ensure ufw is installed
      apt:
        name: ufw
        state: present
        update_cache: false

