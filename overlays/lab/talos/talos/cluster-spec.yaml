apiVersion: platform.labs/v1alpha1
kind: TalosClusterSpec
metadata:
  name: talos
  environment: lab
spec:
  purpose: "Pre-production style Talos cluster on ESXi via govc"

  versions:
    talos: "v1.12.4"
    kubernetes: "v1.35.0"
    ciliumChart: "1.19.1"
    argocdChart: "9.4.15"
    certManagerChart: "1.20.0"
    prometheusStackChart: "82.13.6"
    longhornChart: "1.9.0"
  imageFactory:
    schematicFile: "overlays/lab/talos/talos/schematic.yaml"
    controlPlaneInstallerImage: "factory.talos.dev/vmware-installer/903b2da78f99adef03cbbd4df6714563823f63218508800751560d3bc3557e40:v1.12.4"
    workerInstallerImage: "factory.talos.dev/vmware-installer/c5ecff40b8990cd2ff7d219fb380ac73c7ef52517b9835f1fc2c4ca31247c921:v1.12.4"

  access:
    controlPlaneEndpoint: "https://192.168.0.30:6443"
    talosApiPort: 50000
    kubeApiPort: 6443

  network:
    podCIDR: "10.244.0.0/16"
    serviceCIDR: "10.96.0.0/12"
    gateway: "192.168.0.2"
    nameservers:
      - "192.168.0.53"
    note: "Lab DNS is provided by talos-dns-1 (dnsmasq) at 192.168.0.53."

  loadBalancer:
    implementation: "HAProxy + Keepalived"
    vip: "192.168.0.30"
    nodes:
      - name: "talos-lb-1"
        ip: "192.168.0.31"
        role: "MASTER"
      - name: "talos-lb-2"
        ip: "192.168.0.32"
        role: "BACKUP"
    backends:
      - "192.168.0.61:6443"
      - "192.168.0.62:6443"
      - "192.168.0.63:6443"

  topology:
    controlPlanes:
      count: 3
      nodes:
        - name: "talos-cp-1"
          ip: "192.168.0.61"
        - name: "talos-cp-2"
          ip: "192.168.0.62"
        - name: "talos-cp-3"
          ip: "192.168.0.63"
    workers:
      count: 3
      workerDataDiskGb: 100
      nodes:
        - name: "talos-worker-1"
          ip: "192.168.0.71"
        - name: "talos-worker-2"
          ip: "192.168.0.72"
        - name: "talos-worker-3"
          ip: "192.168.0.73"

  cni:
    strategy: "Disable Talos default CNI and install Cilium (OCI + Helm 3)"
    talosPatchFile: "overlays/lab/talos/talos/patches/cni.patch.yaml"
    ciliumValuesFile: "overlays/lab/talos/talos/helm/cilium/values.yaml"
    cilium-custom:
      kubeProxyReplacement: "true"
      k8sServiceHost: "localhost"
      k8sServicePort: "7445"
      ipam:
        mode: "kubernetes"
      encryption:
        enabled: true
        type: wireguard
        nodeEncryption: true
        strictMode:
          cidr: "0.0.0.0/0"
          egress:
            enabled: false
            cidr: "0.0.0.0/0"
      nodePort:
        policyAuditMode: true
      ingressController:
        enabled: true
        default: true
        loadbalancerMode: shared
      gatewayAPI:
        enabled: true
        enableAlpn: true
        enableAppProtocol: true
      cgroup:
        autoMount:          
          enabled: false
        hostRoot: /sys/fs/cgroup

  addons:
    orchestration:
      baselineScript: "overlays/base/scripts/talos/apply-cluster-config.sh"
      baselineAction: "overlays/base/scripts/talos/cluster.sh apply-cluster-config --env=lab"
      baselineAddonsSource: "TALOS_CLUSTER_BASELINE_ADDONS (fallback TALOS_BASELINE_ADDONS)"
      addonScript: "overlays/base/scripts/talos/phase-network-bringup.sh"
      mode: "baseline list via --addons=..., or one addon via --addon=<name>"
    releases:
      cilium:
        releaseFile: "overlays/lab/talos/talos/helm/cilium/release.yaml"
        namespace: "kube-system"
        validationSelector: "k8s-app=cilium"
      certManager:
        releaseFile: "overlays/lab/talos/talos/helm/cert-manager/release.yaml"
        namespace: "cert-manager"
        validationSelector: "app.kubernetes.io/instance=cert-manager"
        installCRDs: true
      argocd:
        releaseFile: "overlays/lab/talos/talos/helm/argocd/release.yaml"
        namespace: "argocd"
        validationSelector: "app.kubernetes.io/part-of=argocd"
      prometheusStack:
        releaseFile: "overlays/lab/talos/talos/helm/prometheus-stack/release.yaml"
        namespace: "kube-prometheus-stack"
        validationSelector: "app.kubernetes.io/instance=kube-prometheus-stack"
      longhorn:
        releaseFile: "overlays/lab/talos/talos/helm/longhorn/release.yaml"
        namespace: "longhorn-system"
        validationSelector: "app=longhorn-manager"
      longhornPrerequisites:
        workerDataMountpoint: "/var/mnt/longhorn"
        workerPatchFile: "overlays/lab/talos/talos/patches/longhorn.patch.yaml"

  controllerPrerequisites:
    tools:
      - talosctl
      - kubectl
      - helm3
    shell:
      - "kubectl completion + alias k"
      - "helm completion"

  operations:
    bootstrapMode: "cluster-bootstrap.sh --mode=all"
    recommendedActionOrder:
      - "cluster.sh generate"
      - "cluster.sh provision"
      - "cluster.sh apply-config"
      - "cluster.sh bootstrap"
      - "cluster.sh sync-access"
      - "cluster.sh apply-cluster-config"
      - "cluster.sh install-addons (optional extras)"
    globalPatchesDefault: "disabled"
    globalPatchesEnableFlag: "--enable-global-patches"
    clusterPatchesDir: "overlays/lab/talos/talos/patches"
    generatedFromVars:
      bootstrapPatch: "bootstrap.patch.yaml (from TALOS_NAMESERVERS and bootstrap flags)"
      controlPlaneNodePatches: "talos-cp-<n>.patch.yaml (from TALOS_CONTROL_PLANE_IPS/network vars)"
      workerNodePatches: "talos-worker-<n>.patch.yaml (from TALOS_WORKER_IPS/network vars)"

  validation:
    checks:
      - "talosctl version against control-plane nodes"
      - "kubectl get nodes -o wide"
      - "Cilium chart template validation before install"
      - "Addon render + server-side dry-run validation via phase-network-bringup.sh"
