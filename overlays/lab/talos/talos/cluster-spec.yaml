apiVersion: platform.labs/v1alpha1
kind: TalosClusterSpec
metadata:
  name: talos
  environment: lab
spec:
  purpose: "Pre-production style Talos cluster on ESXi via govc"

  versions:
    talos: "v1.12.4"
    kubernetes: "v1.35.0"
    ciliumChart: "1.19.1"

  access:
    controlPlaneEndpoint: "https://192.168.0.30:6443"
    talosApiPort: 50000
    kubeApiPort: 6443

  network:
    podCIDR: "10.244.0.0/16"
    serviceCIDR: "10.96.0.0/12"
    gateway: "192.168.0.2"
    nameservers:
      - "192.168.0.53"
    note: "Lab DNS is provided by talos-dns-1 (dnsmasq) at 192.168.0.53."

  loadBalancer:
    implementation: "HAProxy + Keepalived"
    vip: "192.168.0.30"
    nodes:
      - name: "talos-lb-1"
        ip: "192.168.0.55"
        role: "MASTER"
      - name: "talos-lb-2"
        ip: "192.168.0.56"
        role: "BACKUP"
    backends:
      - "192.168.0.61:6443"
      - "192.168.0.62:6443"
      - "192.168.0.63:6443"

  topology:
    controlPlanes:
      count: 3
      nodes:
        - name: "talos-cp-1"
          ip: "192.168.0.61"
        - name: "talos-cp-2"
          ip: "192.168.0.62"
        - name: "talos-cp-3"
          ip: "192.168.0.63"
    workers:
      count: 3
      nodes:
        - name: "talos-worker-1"
          ip: "192.168.0.71"
        - name: "talos-worker-2"
          ip: "192.168.0.72"
        - name: "talos-worker-3"
          ip: "192.168.0.73"

  cni:
    strategy: "Disable Talos default CNI and install Cilium (OCI + Helm 3)"
    talosPatchFile: "overlays/lab/talos/talos/patches/cni.patch.yaml"
    ciliumValuesFile: "overlays/lab/talos/talos/cilium/values.yaml"
    cilium-custom:
      kubeProxyReplacement: "true"
      k8sServiceHost: "192.168.0.30"
      k8sServicePort: "6443"
      encryption:
        enabled: true
        type: wireguard
        nodeEncryption: true
        strictMode:
          egress:
            enabled: true


  controllerPrerequisites:
    tools:
      - talosctl
      - kubectl
      - helm3
    shell:
      - "kubectl completion + alias k"
      - "helm completion"

  operations:
    bootstrapMode: "cluster-bootstrap.sh --mode=all"
    globalPatchesDefault: "disabled"
    globalPatchesEnableFlag: "--enable-global-patches"
    clusterPatchesDir: "overlays/lab/talos/talos/patches"

  validation:
    checks:
      - "talosctl version against control-plane nodes"
      - "kubectl get nodes -o wide"
      - "Cilium chart template validation before install"
