# Use text install
text

# Aceita o EULA
eula --agreed

# Use CDROM installation media
cdrom

# Keyboard layouts
keyboard --xlayouts='us (intl)','br'
lang en_US.UTF-8 --addsupport=pt_BR.UTF-8
timezone America/Boa_Vista --utc --nontp

# Primeiro boot
firstboot --disable

# Bootloader
# bootloader --location=mbr --boot-drive=sda
# Bootloader (deixa o Anaconda decidir o disco correto)
bootloader --location=mbr --timeout=1

### Initialize any invalid partition tables found on disks.
zerombr

# ignoredisk --only-use=sda
### Removes partitions from the system, prior to creation of new partitions.
### By default, no partitions are removed.
### --all	Erases all partitions from the system
### --initlabel Initializes a disk (or disks) by creating a default disk label for all disks in their respective architecture.
clearpart --all --initlabel
autopart --type=lvm --nohome

# Configuração de rede
network --bootproto=dhcp --onboot=on --noipv6 --activate 

# Serviços padrão
services --enabled=NetworkManager,sshd

# Não configurar X
skipx

# Autenticação e segurança
authselect select sssd
selinux --enforcing
firewall --enabled --ssh

# Configuração de pacotes
%packages --ignoremissing --excludedocs
@core
-ftp
-net-snmp
-telnet
-telnet-server
-tftp
-tftp-server
-xinetd
-ypbind
-ypserv
-iwl*firmware
%end

# Credenciais
rootpw --lock
user --name=ejunior --password=$6$KspR8KgZFVxDOiiF$n4hhyeSGgamrz25mqvOfnK5xm6blwDJftlQZy0H60pwRdPKXsf996/lLzFrfW0H/ZHoE.jEPgVmFZpmgce6jX0 --groups=wheel --gecos="Ednil Libanio da Costa Junior"

# Kdump
%addon com_redhat_kdump --enable --reserve-mb='auto'
%end

# Pós-instalação
%post

dnf install -y oracle-epel-release-el9
dnf makecache
# dnf install -y sudo open-vm-tools perl net-tools bash-completion vim-minimal

mkdir -p /home/ejunior/.ssh
chown ejunior:ejunior /home/ejunior/.ssh
chmod 700 /home/ejunior/.ssh

# Coloque sua chave pública real aqui
echo "" > /home/ejunior/.ssh/authorized_keys
chmod 600 /home/ejunior/.ssh/authorized_keys

echo "ejunior ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/ejunior
chmod 440 /etc/sudoers.d/ejunior

# Otimizações básicas
dnf clean all
rm -rf /var/cache/dnf /var/log/*
truncate -s 0 /etc/machine-id

%end

# Reboot após instalação
reboot --eject
