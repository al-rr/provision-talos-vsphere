# Use text install
text

### Accepts the End User License Agreement.
eula --agreed

# Use CDROM installation media
cdrom

keyboard --xlayouts='us (intl)','br'
lang en_US.UTF-8 --addsupport=pt_BR.UTF-8
timezone America/Boa_Vista --isUtc --nontp

# Run the Setup Agent on first boot
firstboot --enable

# Network information
network --hostname=vagrant.infra.al.rr.lan --bootproto=dhcp --onboot=on --activate 

#bootloader --append=" crashkernel=auto" --location=mbr --boot-drive=nvme0n1
ignoredisk 
clearpart --all --initlabel
autopart --type=lvm

### Modifies the default set of services that will run under the default runlevel.
services --enabled=NetworkManager,sshd

### Do not configure X on the installed system.
skipx

authselect select sssd
selinux --enforcing
firewall --enabled --ssh

%packages --ignoremissing --excludedocs
@core
sudo
open-vm-tools
perl
net-tools

# Exclusões
-ftp
-net-snmp
-telnet
-telnet-server
-tftp
-tftp-server
-xinetd
-ypbind
-ypserv
-iwl*firmware
%end

### Sets up the authentication options for the system.
### The SSDD profile sets sha512 to hash passwords. Passwords are shadowed by default
### See the manual page for authselect-profile for a complete list of possible options.
authselect select sssd

### Sets the state of SELinux on the installed system.
### Defaults to enforcing.
selinux --enforcing

### Configure firewall settings for the system.
### --enabled	reject incoming connections that are not in response to outbound requests
### --ssh		allow sshd service through the firewall
firewall --enabled --ssh


# Credentials
### Lock the root account.
rootpw --lock
### Add a user that can login and escalate privileges.
user --name=packer --password=packer --groups=wheel --gecos="Usuário Packer"

%addon com_redhat_kdump --enable --reserve-mb='auto'

%end

%post
mkdir -p /home/packer/.ssh
chmod 700 /home/packer/.ssh
chown packer:packer /home/packer/.ssh
echo "packer ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer
%end


### Reboot after the installation is complete.
### --eject attempt to eject the media before rebooting.
reboot --eject
